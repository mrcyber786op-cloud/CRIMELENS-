<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRIMELENS Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="admin-wrap"><div id="login-box" class="panel"><h1>CRIMELENS Admin</h1><p class="muted">Secure server-side authentication</p><form id="login-form"><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn" type="submit">Sign In</button><p id="login-msg" class="msg"></p></form></div><div id="dashboard" hidden><header class="admin-head"><a class="brand" href="/">CRIMELENS</a><button id="logout" class="btn ghost">Logout</button></header><div class="panel"><div class="tabs"><button data-type="gallery">Gallery</button><button data-type="course">Courses</button><button data-type="webinar">Webinars</button><button data-type="post">Posts</button></div><form id="content-form" enctype="multipart/form-data"><input type="hidden" id="edit-id"><input id="title" name="title" placeholder="Title" maxlength="160" required><textarea id="description" name="description" placeholder="Description" maxlength="2000"></textarea><input id="link" name="link" placeholder="Optional https:// link"><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div><button class="btn" type="submit">Save</button><button class="btn ghost" id="cancel" type="button">Cancel</button></div><p id="form-msg" class="msg"></p></form><hr><div id="items"></div></div></div></div><script src="/admin.js"></script></body></html>
